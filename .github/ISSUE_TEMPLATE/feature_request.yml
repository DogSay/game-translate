name: Feature request
description: Suggest a reusable engine capability, adapter, or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed reusable solution
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: External patch and rollback boundary
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: This request contains no game files, keys, or private data.
          required: true
